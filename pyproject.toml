[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loopbench"
version = "0.1.0"
description = "The zero-hardware MCP server that benchmarks how well AI models tune control loops."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Karam", email = "karam@loopbench.dev" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "control-systems",
    "pid",
    "benchmark",
    "ai-evaluation",
    "robotics",
    "embedded"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=1.3.0,<2.0.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
loopbench = "loopbench.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loopbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
